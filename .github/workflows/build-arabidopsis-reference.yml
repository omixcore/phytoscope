name: Build complete Arabidopsis TAIR10 reference

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phytoscope-arabidopsis-reference-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build complete Chr1-Chr5 annotation
        run: |
          rm -rf /tmp/phytoscope-arabidopsis
          mkdir -p /tmp/phytoscope-arabidopsis
          python tools/build_arabidopsis_full_reference.py \
            --archive /tmp/phytoscope-arabidopsis/Araport11_GFF3_genes_transposons.201606.gff.gz \
            --output /tmp/phytoscope-arabidopsis/reference

      - name: Validate complete reference
        run: |
          python tools/validate_arabidopsis_reference.py \
            --directory /tmp/phytoscope-arabidopsis/reference

      - name: Install generated reference
        run: |
          rm -f src/main/resources/data/species/arabidopsis/Chr{1,2,3,4,5}.gff3
          cp /tmp/phytoscope-arabidopsis/reference/Chr*.gff3 src/main/resources/data/species/arabidopsis/
          cp /tmp/phytoscope-arabidopsis/reference/manifest.json src/main/resources/data/species/arabidopsis/

      - name: Update provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path("/tmp/phytoscope-arabidopsis/reference/manifest.json").read_text())
          p = Path("src/main/resources/data/reference-provenance.json")
          d = json.loads(p.read_text())
          d["datasets"]["arabidopsis"].update({
            "annotation_scope": src["scope"],
            "source": src["source"],
            "downloaded_from": src["downloaded_from"],
            "archive_sha256": src["archive_sha256"],
            "annotation": src["annotation"],
            "verified_feature_rows": src["total_features"],
            "verified_gene_like_features": src["total_gene_like_features"],
            "chromosome_lengths": {k:v["length"] for k,v in src["chromosomes"].items()},
            "chromosome_sha256": {k:v["sha256"] for k,v in src["chromosomes"].items()},
            "status": "PASS"
          })
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - name: Re-run reference validation after installation
        run: python tools/validate_arabidopsis_reference.py --directory src/main/resources/data/species/arabidopsis

      - name: Run complete Java validation
        run: |
          chmod +x mvnw
          ./mvnw -q -version
          ./mvnw -q -Pui-tests test

      - name: Re-run validation after installation
        run: python tools/validate_arabidopsis_reference.py --directory src/main/resources/data/species/arabidopsis

      - name: Commit generated reference
        run: |
          git config user.name "omixcore"
          git config user.email "fei48548@gmail.com"
          git add src/main/resources/data/species/arabidopsis/Chr*.gff3 src/main/resources/data/species/arabidopsis/manifest.json src/main/resources/data/reference-provenance.json
          if git diff --cached --quiet; then
            echo "No generated reference changes; main already matches the reproducible build."
            exit 0
          fi
          git commit -m "Bundle complete Arabidopsis TAIR10 Chr1-Chr5 reference"
          git push origin HEAD:${GITHUB_REF_NAME}
