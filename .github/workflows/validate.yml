name: Build and package PhytoScope

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and test
        shell: bash
        run: sh mvnw -B -Pui-tests verify
      - name: Package the desktop application
        shell: bash
        run: python tools/package_desktop.py --jar target/phytoscope-0.3.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PhytoScope-${{ matrix.os }}
          path: |
            target/desktop/*.zip
            target/desktop/*.tar.gz
          if-no-files-found: error
