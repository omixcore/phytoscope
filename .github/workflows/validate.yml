name: Validate and package PhytoScope
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundled full annotation
        run: python tools/validate_arabidopsis_reference.py --directory src/main/resources/data/species/arabidopsis
      - name: Isoform analysis boundary cases
        run: python tools/test_isoform_case.py
      - name: Reconcile PIF6 candidate with published beta isoform
        run: python tools/validate_pif6_isoform_identity.py --out target/independent-isoforms/pif6-identity-validation.json
      - name: Reproduce frozen isoform screen and independent validation
        if: runner.os == 'Linux'
        run: python tools/check_isoform_case.py
      - name: Java and JavaFX regressions
        shell: bash
        run: sh mvnw -B -Pui-tests verify
      - name: Install external sequence baselines
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bedtools ncbi-blast+
      - name: Compare promoter extraction with bedtools
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/compare_promoters_bedtools.py --report target/research-validation/research-module-gold-set.json --genome src/main/resources/data/species/arabidopsis/TAIR10_genomic.fna.gz --out target/research-validation/bedtools-promoter-comparison.json
      - name: Compare homology candidates with BLASTP
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/compare_homology_blastp.py --report target/research-validation/research-module-gold-set.json --out target/research-validation/blastp-homology-comparison.json
      - name: Install matched extraction baseline
        run: python -m pip install gffutils==0.13
      - name: Fetch and verify rice bean public reference inputs
        if: runner.os == 'Linux'
        run: python tools/fetch_vigna_reference.py --directory target/non-model/vigna-umbellata
      - name: Validate rice bean full annotation and sequence products
        if: runner.os == 'Linux'
        run: sh mvnw -B -Dtest=NonModelVignaReferenceTest -Dphytoscope.vignaReferenceDir=target/non-model/vigna-umbellata test
      - name: Compare same rice bean task with gffutils
        if: runner.os == 'Linux'
        run: python tools/compare_public_case.py --jar target/phytoscope-0.2.0.jar --annotation target/non-model/vigna-umbellata/GCF_029865625.1_genomic.gff.gz --gene-ids gene-LOC124833352 --out target/non-model-comparison --trials 3
      - name: Four-species matched extraction benchmark
        shell: bash
        run: python tools/run_cross_species_extraction_benchmark.py --jar target/phytoscope-0.2.0.jar --out target/cross-species-extraction --trials 3
      - name: Real case, no display required
        shell: bash
        run: |
          java -Xmx3g -jar target/phytoscope-0.2.0.jar --compare --example arabidopsis --expression examples/arabidopsis-atlas/expression.tsv --loci AT1G67090,AT5G38410,AT5G38420,AT5G38430 --out target/case-study --project target/case-study.phytoscope
          java -Xmx3g -jar target/phytoscope-0.2.0.jar --benchmark --example rice --out target/benchmark-rice
          python tools/validate_structure_inventory.py --source src/main/resources/data/species/rice/rice_chromosomes.gff3 --parsed target/benchmark-rice/parsed-structure.tsv --out target/benchmark-rice/structure-validation.json
      - name: Full official annotations and independent coordinate validation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python tools/fetch_validation_archives.py --cache target/full-archives
          sh mvnw -B -Dtest=FullAnnotationValidationTest -Dphytoscope.fullAnnotationDir=target/full-archives test
          python tools/run_validation.py --jar target/phytoscope-0.2.0.jar --full-dir target/full-archives
      - name: Build standalone application image
        run: python tools/package_desktop.py --jar target/phytoscope-0.2.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/validation/
            target/case-study/
            target/case-study.phytoscope
            target/benchmark-rice/
            target/cross-species-extraction/
            target/research-validation/
            target/non-model-comparison/
            target/independent-isoforms/reproduced/
            target/independent-isoforms/pif6-identity-validation.json
            target/packaged-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: PhytoScope-${{ matrix.os }}
          path: |
            target/desktop/*.tar.gz
            target/desktop/*.zip

  public-data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install openpyxl==3.1.5
      - name: Audit public Arabidopsis splicing and proteomics resources
        run: python tools/audit_public_splicing_evidence.py --out target/public-data-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-data-validation
          path: target/public-data-validation/
