name: Validate and package PhytoScope
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundled full annotation
        run: python tools/validate_arabidopsis_reference.py --directory src/main/resources/data/species/arabidopsis
      - name: Java and JavaFX regressions
        shell: bash
        run: sh mvnw -B -Pui-tests verify
      - name: Real case, no display required
        shell: bash
        run: |
          java -Xmx3g -jar target/phytoscope-0.2.0.jar --compare --example arabidopsis --expression examples/arabidopsis-atlas/expression.tsv --loci AT1G67090,AT5G38410,AT5G38420,AT5G38430 --out target/case-study --project target/case-study.phytoscope
          java -Xmx3g -jar target/phytoscope-0.2.0.jar --benchmark --example rice --out target/benchmark-rice
          python tools/validate_structure_inventory.py --source src/main/resources/data/species/rice/rice_chromosomes.gff3 --parsed target/benchmark-rice/parsed-structure.tsv --out target/benchmark-rice/structure-validation.json
      - name: Full official annotations and independent coordinate validation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python tools/fetch_validation_archives.py --cache target/full-archives
          sh mvnw -B -Dtest=FullAnnotationValidationTest -Dphytoscope.fullAnnotationDir=target/full-archives test
          python tools/run_validation.py --jar target/phytoscope-0.2.0.jar --full-dir target/full-archives
      - name: Build standalone application image
        run: python tools/package_desktop.py --jar target/phytoscope-0.2.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/validation/
            target/case-study/
            target/case-study.phytoscope
            target/benchmark-rice/
            target/research-validation/
            target/packaged-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: PhytoScope-${{ matrix.os }}
          path: |
            target/desktop/*.tar.gz
            target/desktop/*.zip
