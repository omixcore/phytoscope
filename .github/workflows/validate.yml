name: Build and package PhytoScope

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and test (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sh mvnw -B -Pui-tests verify
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call mvnw.cmd -B -Pui-tests verify
      - name: Package the desktop application
        shell: bash
        run: python tools/package_desktop.py --jar target/phytoscope-0.0.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PhytoScope-${{ matrix.os }}
          path: |
            target/desktop/*.zip
            target/desktop/*.tar.gz
          if-no-files-found: error

  publish-windows-001:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: phytoscope-release-v0.0.1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhytoScope-windows-latest
          path: release
      - name: Publish the verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.1 >/dev/null 2>&1; then
            exit 0
          fi
          cd release
          mv PhytoScope-Windows-*-0.0.1.zip PhytoScope-Windows-0.0.1.zip
          sha256sum PhytoScope-Windows-0.0.1.zip > SHA256SUMS.txt
          gh release create v0.0.1 PhytoScope-Windows-0.0.1.zip SHA256SUMS.txt \
            --latest --target "$GITHUB_SHA" --title "PhytoScope v0.0.1" \
            --notes "PhytoScope 0.0.1 for Windows x64 with a bundled Java runtime and English application messages."
